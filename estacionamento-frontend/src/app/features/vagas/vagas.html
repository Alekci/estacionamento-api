<div class="ml-64">
  <app-header title="Vagas" subtitle="Gerencie as vagas do estacionamento"></app-header>

  <main class="p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <input
          type="text"
          placeholder="Buscar por número ou tipo..."
          [value]="filtro()"
          (input)="filtro.set($any($event.target).value)"
          class="w-80 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="checkbox"
            [checked]="apenasDisponiveis()"
            (change)="apenasDisponiveis.set($any($event.target).checked)"
            class="w-4 h-4 rounded"
          />
          <span class="text-sm text-gray-700">Apenas disponíveis</span>
        </label>
      </div>
      <button
        (click)="abrirNovo()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium transition"
      >
        + Nova Vaga
      </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Número</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Tipo</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
            <th class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase">Ações</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (vaga of vagasFiltradas; track vaga.id_vaga) {
            <tr class="hover:bg-gray-50 transition">
              <td class="px-6 py-4 text-sm text-gray-500">#{{ vaga.id_vaga }}</td>
              <td class="px-6 py-4">
                <span class="text-2xl font-bold text-gray-900">{{ vaga.numero_vaga }}</span>
              </td>
              <td class="px-6 py-4">
                <span
                  class="text-xs px-3 py-1 rounded-full font-medium"
                  [class.bg-purple-100]="vaga.tipo_vaga === 'PCD'"
                  [class.text-purple-700]="vaga.tipo_vaga === 'PCD'"
                  [class.bg-gray-100]="vaga.tipo_vaga === 'Vaga Comum'"
                  [class.text-gray-700]="vaga.tipo_vaga === 'Vaga Comum'"
                >
                  {{ vaga.tipo_vaga }}
                </span>
              </td>
              <td class="px-6 py-4">
                @if (estaOcupada(vaga)) {
                  <span class="text-xs px-3 py-1 rounded-full bg-red-100 text-red-700 font-medium">
                    🔴 Ocupada
                  </span>
                } @else {
                  <span class="text-xs px-3 py-1 rounded-full bg-green-100 text-green-700 font-medium">
                    🟢 Livre
                  </span>
                }
              </td>
              <td class="px-6 py-4 text-right">
                <button
                  (click)="abrirEdicao(vaga)"
                  class="text-blue-600 hover:text-blue-800 font-medium text-sm mr-3"
                >
                  Editar
                </button>
                <button
                  (click)="confirmarDelete(vaga)"
                  class="text-red-600 hover:text-red-800 font-medium text-sm"
                >
                  Excluir
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                Nenhuma vaga encontrada
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </main>
</div>

<app-modal
  [isOpen]="modalAberto"
  [title]="editando ? 'Editar Vaga' : 'Nova Vaga'"
  (close)="modalAberto = false"
>
  <form [formGroup]="form" (ngSubmit)="salvar()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Número *</label>
      <input
        type="number"
        formControlName="numero_vaga"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ex: 31"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tipo *</label>
      <select
        formControlName="tipo_vaga"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        @for (tipo of tipos; track tipo) {
          <option [value]="tipo">{{ tipo }}</option>
        }
      </select>
    </div>

    <div class="flex gap-3 pt-4">
      <button
        type="button"
        (click)="modalAberto = false"
        class="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="form.invalid"
        class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium rounded-lg transition"
      >
        {{ editando ? 'Salvar alterações' : 'Criar vaga' }}
      </button>
    </div>
  </form>
</app-modal>

<app-confirm-dialog
  [isOpen]="confirmAberto"
  title="Remover vaga?"
  [message]="'Tem certeza que deseja remover a vaga #' + (vagaParaDeletar?.numero_vaga ?? '') + '?'"
  confirmText="Sim, remover"
  (confirmed)="deletar()"
  (cancelled)="confirmAberto = false"
></app-confirm-dialog>
