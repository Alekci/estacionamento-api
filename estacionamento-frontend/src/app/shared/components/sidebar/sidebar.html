<aside class="w-64 bg-gray-900 text-white flex flex-col h-screen fixed left-0 top-0">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-800">
    <h1 class="text-2xl font-bold flex items-center gap-2">
      <span>🅿️</span>
      <span>Estacionamento</span>
    </h1>
    <p class="text-xs text-gray-400 mt-1">Painel Administrativo</p>
  </div>

  <!-- Menu -->
  <nav class="flex-1 p-4 space-y-1">
    @for (item of menuItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-600 text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors cursor-pointer"
      >
        <span class="text-xl">{{ item.icon }}</span>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-800">
    <p class="text-xs text-gray-500 text-center">
      © 2026 Estacionamento
    </p>
  </div>
</aside>
