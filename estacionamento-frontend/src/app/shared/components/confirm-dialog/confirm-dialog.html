@if (isOpen) {
  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full animate-scale-in">
      <div class="p-6">
        <div
          class="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-2xl mb-4"
          [class.bg-red-100]="variant === 'danger'"
          [class.bg-blue-100]="variant === 'primary'"
        >
          @if (variant === 'danger') { ⚠️ } @else { ℹ️ }
        </div>

        <h3 class="text-xl font-bold text-gray-900 text-center mb-2">{{ title }}</h3>
        <p class="text-gray-600 text-center mb-6">{{ message }}</p>

        <div class="flex gap-3">
          <button
            (click)="cancelled.emit()"
            class="flex-1 px-4 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition"
          >
            {{ cancelText }}
          </button>
          <button
            (click)="confirmed.emit()"
            class="flex-1 px-4 py-2.5 rounded-lg text-white font-medium transition"
            [class.bg-red-600]="variant === 'danger'"
            [class.hover:bg-red-700]="variant === 'danger'"
            [class.bg-blue-600]="variant === 'primary'"
            [class.hover:bg-blue-700]="variant === 'primary'"
          >
            {{ confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
